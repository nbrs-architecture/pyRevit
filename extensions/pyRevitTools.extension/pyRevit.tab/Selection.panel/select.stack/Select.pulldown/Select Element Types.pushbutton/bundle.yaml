title:
  en_us: Select Element Types
tooltip:
  en_us: >
    This tool allows you to select ElementTypes of a specified category.
    Note:  ElementTypes aren't identified in the Revit UI when selected.  Meaning they are visible in the filter window of Revit,  but there is no way to know if it is an Element or an ElementType
    as Revit displays the Category of the said Element or ElementType.
